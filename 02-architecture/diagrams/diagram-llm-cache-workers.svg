<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <rect x="20" y="20" width="1160" height="760" rx="12" fill="#f8fafc" stroke="#e5e7eb"/>
  <text x="40" y="60" font-size="24" font-family="Arial" fill="#111827">SBA-Agentic Architecture (LLM • Cache • Workers)</text>
  <!-- Orchestrator -->
  <rect x="60" y="120" width="360" height="160" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="80" y="150" font-size="18" font-family="Arial" fill="#1f2937">Orchestrator</text>
  <text x="80" y="180" font-size="12" font-family="Arial" fill="#374151">• LLM Provider Abstraction (OpenAI/Anthropic)</text>
  <text x="80" y="200" font-size="12" font-family="Arial" fill="#374151">• Circuit Breaker & Retry (Jitter Exponential)</text>
  <text x="80" y="220" font-size="12" font-family="Arial" fill="#374151">• Streaming Token Events</text>
  <!-- LLM Providers -->
  <rect x="460" y="120" width="300" height="160" rx="8" fill="#fde68a" stroke="#f59e0b"/>
  <text x="480" y="150" font-size="18" font-family="Arial" fill="#1f2937">LLM Providers</text>
  <text x="480" y="180" font-size="12" font-family="Arial" fill="#374151">OpenAI • Anthropic</text>
  <text x="480" y="200" font-size="12" font-family="Arial" fill="#374151">Streaming Responses</text>
  <!-- Knowledge API -->
  <rect x="60" y="320" width="360" height="160" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="80" y="350" font-size="18" font-family="Arial" fill="#1f2937">Knowledge API</text>
  <text x="80" y="380" font-size="12" font-family="Arial" fill="#374151">• search • search-cached • upsert</text>
  <text x="80" y="400" font-size="12" font-family="Arial" fill="#374151">• Zod Validation • RBAC</text>
  <!-- Cache Layer -->
  <rect x="460" y="320" width="300" height="160" rx="8" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="480" y="350" font-size="18" font-family="Arial" fill="#1f2937">Cache Layer</text>
  <text x="480" y="380" font-size="12" font-family="Arial" fill="#374151">Upstash Redis (REST)</text>
  <text x="480" y="400" font-size="12" font-family="Arial" fill="#374151">@sba/kv/cache (TTL & Batch)</text>
  <!-- Supabase -->
  <rect x="800" y="320" width="360" height="160" rx="8" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="820" y="350" font-size="18" font-family="Arial" fill="#1f2937">Supabase</text>
  <text x="820" y="380" font-size="12" font-family="Arial" fill="#374151">RPC kb_search_ft / kb_search_vec</text>
  <!-- Workers & Metrics -->
  <rect x="60" y="520" width="360" height="160" rx="8" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="80" y="550" font-size="18" font-family="Arial" fill="#1f2937">Workers (BullMQ)</text>
  <text x="80" y="580" font-size="12" font-family="Arial" fill="#374151">Render • Tool Execution • Index • Metrics</text>
  <text x="80" y="600" font-size="12" font-family="Arial" fill="#374151">Lag • Status • Throughput</text>
  <!-- Prometheus -->
  <rect x="460" y="520" width="300" height="160" rx="8" fill="#f3f4f6" stroke="#d1d5db"/>
  <text x="480" y="550" font-size="18" font-family="Arial" fill="#1f2937">Prometheus</text>
  <text x="480" y="580" font-size="12" font-family="Arial" fill="#374151">/metrics • /metrics/workers</text>
  <!-- Arrows -->
  <line x1="420" y1="200" x2="460" y2="200" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="420" y1="400" x2="460" y2="400" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="760" y1="400" x2="800" y2="400" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="360" y1="600" x2="460" y2="600" stroke="#111827" stroke-width="2" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#111827" />
    </marker>
  </defs>
</svg>

